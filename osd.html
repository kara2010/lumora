<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none;
    font-family: 'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace; font-weight: 700;
    font-variant-numeric: tabular-nums; font-feature-settings: "tnum";  /* Ziffern gleich breit -> keine Sprünge */
  }
  /* Sanftes Ein-/Ausblenden per CSS-Opacity: der urspruengliche Plan (DirectComposition-Visual-
     Opacity, GPU-getrieben ohne Web-Message-Latenz) scheiterte an E_NOINTERFACE (v1-DComp-Device,
     IDCompositionVisual3 braeuchte DCompositionCreateDevice3 - gleicher Fund wie bei der Deckkraft
     des Analyse-OSD). Startzustand (unsichtbar, NUR fuer das Anzeige-Overlay) setzt das Skript
     SYNCHRON beim Registrieren des 'osd-fade'-Listeners, nicht hier per CSS-Default - sonst
     koennte das einmalige erste 'osd-fade'(true) verloren gehen, falls das Skript beim allerersten
     Zeigen noch nicht fertig geladen war, und das Overlay bliebe dauerhaft unsichtbar (schlimmer
     als der Ausgangsfehler). 'osd-fade' (osdFadeVisual in main.cpp) schaltet Dauer + Zielwert um.
     Edit-Modus bleibt aussen vor (siehe osd-fade-Handler + body.edit unten). */
  body { transition: opacity .11s linear; }
  :root {
    --nv: #74e857; --amd: #ff8a1e; --val: #ffe100; --fps: #ffffff; --ft: #6fe86f;
    --accent: #74e857;              /* Akzentfarbe (überschreibbar per Config) */
    --panel-op: 0.55;
  }
  /* Panel sitzt absolut in der gewählten Ecke; horizontale Themes zentrieren am Rand */
  #panel {
    position: absolute; margin: 18px; color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,.9); font-variant-numeric: tabular-nums;
  }
  body.pos-tl #panel { top: 0;    left: 0; }
  body.pos-tr #panel { top: 0;    right: 0; }
  body.pos-bl #panel { bottom: 0; left: 0; }
  body.pos-br #panel { bottom: 0; right: 0; }
  .osd i { font-style: normal; font-size: .6em; margin-left: 2px; opacity: .95; }
  .hidden { display: none !important; }

  /* ============================ THEMES ============================ */

  /* -------- KOMPAKT -------- */
  body.theme-compact #panel { width: 232px; padding: 13px 15px 14px;
    background: rgba(8,8,12,var(--panel-op)); border-radius: 10px; backdrop-filter: blur(2px); }
  .t-compact .grp { margin-bottom: 13px; } .t-compact .grp:last-child { margin-bottom: 0; }
  .t-compact .lbl { font-size: 11px; letter-spacing: .16em; color: #8a8a8a; margin-bottom: 1px; }
  .t-compact .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .t-compact .name { font-size: 21px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t-compact .big  { font-size: 21px; color: var(--val); flex: 0 0 auto; }
  .t-compact .row  { display: flex; justify-content: space-between; align-items: baseline; margin-top: 1px; }
  .t-compact .row .k { font-size: 15px; } .t-compact .row .v { font-size: 15px; color: var(--val); }
  .t-compact .nv .name, .t-compact .nv .row .k { color: var(--nv); }
  .t-compact .amd .name, .t-compact .amd .row .k { color: var(--amd); }
  .t-compact .fps .name { color: var(--nv); } .t-compact .fps .big { font-size: 27px; color: #fff; }
  .t-compact .track, .t-compact .stats { display: none; }
  .t-compact canvas { display: block; width: 100%; height: 42px; margin-top: 4px; }
  .t-compact .ftline { font-size: 13px; color: #9a9a9a; margin-top: 5px; }
  .t-compact .ftline .v { color: var(--ft); }

  /* -------- MINIMAL -------- */
  body.theme-min #panel { display: flex; flex-direction: column; gap: 7px; }
  .t-min .line { display: flex; align-items: baseline; gap: 9px; }
  .t-min .k { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; opacity: .85; }
  .t-min .k.nv { color: var(--nv); } .t-min .k.amd { color: var(--amd); } .t-min .k.fp { color: #fff; }
  .t-min .v { font-size: 24px; color: #fff; } .t-min .v.big { font-size: 33px; }
  .t-min .sub { font-size: 15px; opacity: .85; }
  .t-min canvas, .t-min .track, .t-min .lbl { display: none; }

  /* -------- BALKEN -------- */
  body.theme-bar #panel { width: 244px; padding: 14px 15px;
    background: rgba(10,10,14,calc(var(--panel-op) + .07)); border-radius: 10px; border: 1px solid rgba(255,255,255,.06); }
  .t-bar .grp { margin-bottom: 14px; } .t-bar .grp:last-child { margin-bottom: 0; }
  .t-bar .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; gap: 8px; }
  .t-bar .name { font-size: 15px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t-bar .nv .name { color: var(--nv); } .t-bar .amd .name { color: var(--amd); } .t-bar .fps .name { color: var(--nv); }
  .t-bar .big { font-size: 17px; color: #fff; flex: 0 0 auto; } .t-bar .fps .big { font-size: 26px; }
  .t-bar .fps .big i { color: var(--nv); }
  .t-bar .lbl { display: none; }
  .t-bar .track { height: 7px; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; margin-bottom: 7px; }
  .t-bar .fill { height: 100%; border-radius: 4px; transition: width .2s; }
  .t-bar .nv .fill { background: linear-gradient(90deg, #3f8f45, var(--nv)); }
  .t-bar .amd .fill { background: linear-gradient(90deg, #a5561a, var(--amd)); }
  .t-bar .row { display: inline-flex; gap: 4px; margin-right: 12px; font-size: 13px; color: #d6d6d6; }
  .t-bar .row .v { color: var(--val); } .t-bar .stats { margin-top: -2px; }
  .t-bar .fps .track, .t-bar .fps-rows { display: none; }
  .t-bar canvas { display: block; width: 100%; height: 40px; margin-top: 4px; }

  /* -------- NEON -------- */
  body.theme-neon #panel { width: 226px; padding: 13px 15px; background: rgba(6,8,16,calc(var(--panel-op) + .25));
    border-radius: 6px; border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
    box-shadow: 0 0 0 1px rgba(0,0,0,.5), 0 0 20px color-mix(in srgb, var(--accent) 22%, transparent); }
  .t-neon .grp { margin-bottom: 12px; padding-left: 9px; border-left: 2px solid; }
  .t-neon .grp:last-child { margin-bottom: 0; }
  .t-neon .grp.nv { border-color: var(--nv); } .t-neon .grp.amd { border-color: var(--amd); } .t-neon .grp.fps { border-color: #4bd6ff; }
  .t-neon .lbl { display: none; }
  .t-neon .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .t-neon .name { font-size: 16px; letter-spacing: .03em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t-neon .nv .name { color: var(--nv); text-shadow: 0 0 8px rgba(116,232,87,.55); }
  .t-neon .amd .name { color: var(--amd); text-shadow: 0 0 8px rgba(255,138,30,.5); }
  .t-neon .fps .name { color: #4bd6ff; text-shadow: 0 0 8px rgba(75,214,255,.5); }
  .t-neon .big { font-size: 18px; color: #fff; flex: 0 0 auto; } .t-neon .fps .big { font-size: 24px; }
  .t-neon .row { display: inline-flex; gap: 3px; margin-right: 10px; margin-top: 3px; font-size: 12.5px; color: #cfd3da; }
  .t-neon .row .v { color: var(--val); } .t-neon .stats { margin-top: 1px; }
  .t-neon .track { display: none; } .t-neon canvas { display: none; }

  /* -------- LEISTE (horizontal) -------- */
  body.theme-strip #panel { margin: 14px; }
  body.theme-strip.pos-tl #panel, body.theme-strip.pos-tr #panel { left: 50%; right: auto; transform: translateX(-50%); }
  body.theme-strip.pos-bl #panel, body.theme-strip.pos-br #panel { left: 50%; right: auto; transform: translateX(-50%); }
  .t-strip { display: flex; align-items: center; background: rgba(8,8,12,var(--panel-op));
    border-radius: 9px; padding: 8px 4px; backdrop-filter: blur(2px); }
  .t-strip .seg { display: flex; align-items: baseline; gap: 7px; padding: 2px 15px; }
  .t-strip .seg + .seg { border-left: 1px solid rgba(255,255,255,.14); }
  .t-strip .nm { font-size: 12px; letter-spacing: .06em; max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t-strip .nv .nm { color: var(--nv); } .t-strip .amd .nm { color: var(--amd); } .t-strip .fps .nm { color: #fff; }
  .t-strip .m { font-size: 15px; color: #fff; } .t-strip .m .v { color: var(--val); }
  .t-strip .fps .m { font-size: 20px; }
  .t-strip .lbl, .t-strip .track, .t-strip canvas { display: none; }

  /* -------- KACHELN (horizontal) -------- */
  body.theme-tiles #panel { margin: 14px; }
  body.theme-tiles.pos-tl #panel, body.theme-tiles.pos-tr #panel,
  body.theme-tiles.pos-bl #panel, body.theme-tiles.pos-br #panel { left: 50%; right: auto; transform: translateX(-50%); }
  .t-tiles { display: flex; gap: 8px; }
  .t-tiles .tile { background: rgba(8,8,12,calc(var(--panel-op) + .07)); border-radius: 9px; padding: 9px 14px; min-width: 92px; border-top: 2px solid; }
  .t-tiles .tile.nv { border-color: var(--nv); } .t-tiles .tile.amd { border-color: var(--amd); } .t-tiles .tile.fps { border-color: #fff; }
  .t-tiles .cap { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: #9aa0aa; margin-bottom: 3px; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t-tiles .tile.nv .cap { color: var(--nv); } .t-tiles .tile.amd .cap { color: var(--amd); }
  .t-tiles .num { font-size: 24px; color: #fff; line-height: 1; } .t-tiles .num .v { color: var(--val); font-size: .5em; }
  .t-tiles .tile.fps .num { font-size: 30px; }
  .t-tiles .sub { font-size: 11.5px; color: #c4c8d0; margin-top: 4px; } .t-tiles .sub .v { color: var(--val); }
  .t-tiles .lbl, .t-tiles .track, .t-tiles canvas { display: none; }

  /* -------- Live-Edit -------- */
  /* NORMALBETRIEB (kein Edit): das Fenster ist genau panelgross -> Panel fix oben-links
     mit 14px Rand. Die Bildschirm-Ecke macht allein die Fensterposition (Shell). !important,
     um die Theme-Zentrierung (Leiste/Kacheln) und pos-*-Regeln zu ueberschreiben. Im
     Edit-Modus (body.edit) greift das NICHT -> dort bleibt die Vollbild-Eckplatzierung. */
  body:not(.edit) #panel { position: static !important; margin: 14px !important;
    left: auto !important; right: auto !important; top: auto !important; bottom: auto !important; transform: none !important; }
  body.edit #panel { outline: 2px dashed #4f8ef7; outline-offset: 5px; cursor: move; }
  /* Edit-Fenster ist ein normales, immer sichtbares Fenster - vom neuen Fade-Standard
     (body{opacity:0}) und von jeder verirrten 'osd-fade'-Nachricht ausnehmen. */
  body.edit { opacity: 1 !important; transition: none !important; }
  /* ===== Live-Edit-Leiste: Lumora-Look (Glas-Panel, Sektionen, Akzent #4f8ef7) ===== */
  #editbar { display: none; position: absolute; left: 50%; top: 16px; transform: translateX(-50%);
    z-index: 10; flex-direction: column; gap: 10px; white-space: nowrap; padding: 13px 16px 11px;
    background: linear-gradient(180deg, rgba(24,27,38,.97), rgba(14,16,23,.97));
    border: 1px solid rgba(255,255,255,.10); border-radius: 14px;
    box-shadow: 0 18px 48px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter: blur(14px) saturate(1.2);
    color: #d8d8e2; font-family: 'Segoe UI','DejaVu Sans',sans-serif; font-weight: 400; font-size: 13px; text-shadow: none; }
  /* Akzent-Verlaufsrahmen (feiner Ring, oben links + unten rechts blau angehaucht) */
  #editbar::before { content: ''; position: absolute; inset: -1px; border-radius: 15px; padding: 1px;
    background: linear-gradient(125deg, rgba(79,142,247,.55), rgba(255,255,255,.10) 30%, rgba(255,255,255,.05) 70%, rgba(79,142,247,.4));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }
  body.edit #editbar { display: flex; animation: eb-in .22s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes eb-in { from { opacity: 0; transform: translateX(-50%) translateY(10px) scale(.97); }
                     to   { opacity: 1; transform: translateX(-50%) translateY(0)    scale(1); } }
  /* Leiste IMMER gegenueber vom OSD, damit sie es nie verdeckt (v.a. horizontale
     Themes, die oben/unten mittig sitzen): OSD oben -> Leiste unten und umgekehrt. */
  body.pos-tl #editbar, body.pos-tr #editbar { top: auto; bottom: 16px; }
  body.pos-bl #editbar, body.pos-br #editbar { top: 16px; bottom: auto; }
  #editbar b { color: #fff; font-weight: 600; }
  .eb-top { display: flex; align-items: stretch; gap: 0; }
  /* Sektionen als "Karten": Label OBEN, Kontrolle darunter, feine Trenner dazwischen */
  .eb-ctl { display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    gap: 8px; padding: 2px 18px 0; }
  .eb-ctl:first-child { padding-left: 4px; }
  .eb-ctl + .eb-ctl { border-left: 1px solid rgba(255,255,255,.07); }
  .eb-row { display: flex; align-items: center; gap: 9px; min-height: 34px; }
  .eb-lbl { color: #7e879c; font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
  /* Design-Pfeile: rund, weich, mit Druck-Feedback */
  .eb-arrow { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); color: #e8eaf2;
    width: 24px; height: 24px; border-radius: 50%; cursor: pointer; font-size: 15px; line-height: 1; padding: 0 0 2px;
    transition: background .15s, border-color .15s, transform .1s; }
  .eb-arrow:hover { background: rgba(79,142,247,.22); border-color: rgba(79,142,247,.65); }
  .eb-arrow:active { transform: scale(.88); }
  .eb-theme { min-width: 84px; text-align: center; color: #fff; font-weight: 600; font-size: 13.5px; letter-spacing: .01em; }
  /* Deckkraft-Regler: eigene Optik (Track + Akzent-Daumen mit Glow) */
  #ebOpacity { -webkit-appearance: none; appearance: none; width: 104px; height: 20px; background: transparent; cursor: pointer; }
  #ebOpacity::-webkit-slider-runnable-track { height: 4px; border-radius: 999px;
    background: linear-gradient(90deg, rgba(79,142,247,.9), rgba(79,142,247,.35)); }
  #ebOpacity::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5px;
    border-radius: 50%; background: #fff; border: 2px solid #4f8ef7;
    box-shadow: 0 0 0 4px rgba(79,142,247,.18), 0 1px 4px rgba(0,0,0,.5); transition: box-shadow .15s; }
  #ebOpacity:hover::-webkit-slider-thumb { box-shadow: 0 0 0 6px rgba(79,142,247,.28), 0 1px 4px rgba(0,0,0,.5); }
  /* Positions-Ecken: Mini-Monitor-Raster */
  .eb-corners { display: grid; grid-template-columns: repeat(2, 22px); grid-auto-rows: 22px; gap: 4px;
    padding: 5px; background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.08); border-radius: 8px; }
  .eb-corners.horiz { grid-template-columns: 22px; }   /* nur oben/unten -> untereinander */
  .eb-corner { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); color: #99a0b2;
    border-radius: 5px; cursor: pointer; font-size: 11px; line-height: 1; padding: 0;
    transition: background .15s, border-color .15s, color .15s, box-shadow .15s; }
  .eb-corner:hover { border-color: rgba(79,142,247,.7); color: #fff; background: rgba(79,142,247,.14); }
  .eb-corner.on { border-color: #4f8ef7; color: #fff; background: rgba(79,142,247,.32);
    box-shadow: 0 0 8px rgba(79,142,247,.45), inset 0 0 4px rgba(79,142,247,.35); }
  /* Wert-Chips: Pillen mit Akzent-Glow im aktiven Zustand */
  .eb-fields { display: flex; flex-direction: column; gap: 6px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.08); }
  .eb-frow { display: flex; align-items: center; gap: 6px; }
  /* Gruppen in den OSD-Farben (GPU gruen, CPU orange, FPS weiss) mit Farbpunkt - stellt die
     visuelle Verbindung zum Panel her */
  .eb-grp { min-width: 40px; font-size: 10px; font-weight: 700; letter-spacing: .12em; display: flex; align-items: center; gap: 5px; }
  .eb-grp::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; box-shadow: 0 0 5px currentColor; }
  .eb-frow:nth-child(1) .eb-grp { color: var(--nv); }
  .eb-frow:nth-child(2) .eb-grp { color: var(--amd); }
  .eb-frow:nth-child(3) .eb-grp { color: #e8eaf2; }
  .eb-chip { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); color: #a8aebe;
    border-radius: 999px; padding: 3px 11px; font-size: 11px; cursor: pointer;
    transition: background .15s, border-color .15s, color .15s, box-shadow .15s; }
  .eb-chip:hover { border-color: rgba(79,142,247,.7); color: #eef1f8; background: rgba(79,142,247,.10); }
  .eb-chip.on { background: linear-gradient(180deg, rgba(95,155,249,.42), rgba(63,126,232,.26)); border-color: #4f8ef7; color: #fff;
    box-shadow: 0 0 8px rgba(79,142,247,.4), inset 0 1px 0 rgba(255,255,255,.18); }
  .eb-hint { color: #6f7688; font-size: 11px; text-align: center; padding-top: 2px; }
  .eb-hint b { color: #9aa2b5; font-weight: 600; }
  /* Fertig: Akzent-Verlauf mit sanftem Lift */
  #editDone::before { content: '✓'; margin-right: 7px; font-weight: 700; }
  #editDone { align-self: center; background: linear-gradient(180deg, #5f9bf9, #3f7ee8); color: #fff; border: 1px solid rgba(255,255,255,.18);
    border-radius: 9px; padding: 7px 18px; font-size: 13px; font-weight: 600; cursor: pointer; margin-left: 18px;
    box-shadow: 0 4px 14px rgba(63,126,232,.4), inset 0 1px 0 rgba(255,255,255,.25);
    transition: transform .12s, box-shadow .15s, filter .15s; }
  #editDone:hover { filter: brightness(1.08); transform: translateY(-1px); box-shadow: 0 6px 18px rgba(63,126,232,.5), inset 0 1px 0 rgba(255,255,255,.25); }
  #editDone:active { transform: translateY(0) scale(.97); }
</style>
</head>
<body class="pos-tl theme-bar">
  <div id="editbar">
    <div class="eb-top">
      <div class="eb-ctl">
        <span class="eb-lbl">Design</span>
        <div class="eb-row">
          <button class="eb-arrow" id="ebPrev" title="Vorheriges Design">‹</button>
          <span class="eb-theme" id="ebThemeName">Kompakt</span>
          <button class="eb-arrow" id="ebNext" title="Nächstes Design">›</button>
        </div>
      </div>
      <div class="eb-ctl">
        <span class="eb-lbl">Deckkraft</span>
        <div class="eb-row"><input type="range" id="ebOpacity" min="0.2" max="0.95" step="0.05"></div>
      </div>
      <div class="eb-ctl">
        <span class="eb-lbl">Position</span>
        <div class="eb-row"><div class="eb-corners" id="ebCorners"></div></div>
      </div>
      <button id="editDone">Fertig</button>
    </div>
    <div class="eb-fields" id="ebFields"></div>
    <div class="eb-hint"><b>Ziehen</b> = Position &nbsp;·&nbsp; <b>Mausrad</b> = Größe</div>
  </div>
  <div id="panel"></div>

<script>
  // ===================== Konfiguration & Daten ==========================
  const UNIT = { load:'%', temp:'°C', power:'W', clock:'MHz', vram:'MB', ram:'MB', frametime:'ms' };
  const LABEL = { temp:'temp', power:'power', clock:'clock', vram:'VRAM', ram:'RAM' };
  const ALL = {
    gpu: ['load','temp','power','clock','vram'],
    cpu: ['load','temp','clock','power','ram'],
    fps: ['fps','frametime','graph'],
    net: ['rate','total'],
  };
  let cfg = { theme: 'bar', fields: JSON.parse(JSON.stringify(ALL)), accent: '#74e857', opacity: 0.55 };   // Standard-Design: Balken
  // Fuer die Live-Edit-Leiste: Design-Namen + Kurzlabels der waehlbaren Werte
  const EB_THEMES = [['compact','Kompakt'],['min','Minimal'],['bar','Balken'],['neon','Neon'],['strip','Leiste'],['tiles','Kacheln']];
  const EB_FLD = {
    gpu: [['load','Last'],['temp','Temp'],['power','Watt'],['clock','Takt'],['vram','VRAM']],
    cpu: [['load','Last'],['temp','Temp'],['clock','Takt'],['power','Watt'],['ram','RAM']],
    fps: [['fps','FPS'],['frametime','ms'],['graph','Graph']],
    net: [['rate','Rate'],['total','Summe']],
  };
  let data = { gpu: null, cpu: null, fps: null, frametime: null, api: null, net: null };

  const panel = document.getElementById('panel');
  const has = (cat, f) => (cfg.fields[cat] || []).includes(f);
  const esc = s => String(s == null ? '' : s);

  // ---- Fenster-Groesse an den Panel-Inhalt melden -------------------------------------
  // Die Shell verkleinert das OSD-Fenster auf GENAU diese Flaeche (der WebView2-Inhalt
  // rendert weiter Vollbild, nur das Fenster + der DComp-Visual werden verschoben). Damit
  // deckt das Overlay nie mehr den ganzen Desktop ab und kann Desktop-Symbole nicht
  // blockieren - egal wie das Click-through auf dem jeweiligen System reagiert.
  // Im Edit-Modus NICHT melden (dort ist das Fenster absichtlich Vollbild + interaktiv).
  function reportBounds() {
    if (!ipcRenderer || editing) return;
    const r = panel.getBoundingClientRect();
    if (r.width < 2 || r.height < 2) return;
    const dpr = window.devicePixelRatio || 1, M = 14;   // Rand ums Panel (ersetzt das alte margin)
    const corner = ['tl','tr','bl','br'].find(c => document.body.classList.contains('pos-' + c)) || 'tl';
    const horiz = document.body.classList.contains('theme-strip') || document.body.classList.contains('theme-tiles');
    ipcRenderer.invoke('osd-bounds', {
      w: Math.ceil((r.width  + 2 * M) * dpr),
      h: Math.ceil((r.height + 2 * M) * dpr),
      corner, horiz
    });
  }
  let _rbRaf = 0;
  function scheduleBounds() { if (_rbRaf) return; _rbRaf = requestAnimationFrame(() => { _rbRaf = 0; reportBounds(); }); }
  try { new ResizeObserver(scheduleBounds).observe(panel); } catch (e) {}

  // ---- kleine HTML-Helfer ----
  // Wertspan mit data-role für Live-Updates: <span data-role="gpu.temp">–</span><i>°C</i>
  const val = (role, unit) => `<span class="v" data-role="${role}">–</span>${unit ? `<i>${unit}</i>` : ''}`;

  // ===================== Renderer je Theme ==============================
  function catList(cat) { return (cfg.fields[cat] || []); }

  function rowsFor(cat) {                 // Zeilen (ohne load/fps – die stehen im Kopf)
    const skip = cat === 'fps' ? ['fps','frametime','graph'] : ['load'];
    return catList(cat).filter(f => !skip.includes(f));
  }

  // Reihenfolge der Gruppen: frei sortierbar (Einstellungen -> Overlay -> Werte).
  // Unbekannte/fehlende Eintraege haengen in der Standardreihenfolge hinten dran -
  // eine alte Konfiguration ohne gespeicherte Reihenfolge bleibt so unveraendert.
  function orderList() {
    const std = ['gpu','cpu','fps','net'];
    const o = Array.isArray(cfg.order) ? cfg.order.filter(c => std.includes(c)) : [];
    for (const c of std) if (!o.includes(c)) o.push(c);
    return o;
  }

  function buildCompact() {
    let h = '<div class="osd t-compact">';
    for (const cat of orderList()) {
      if (cat === 'net') { h += netSeg('grp'); continue; }
      if (!catList(cat).length) continue;
      h += `<div class="grp ${cat === 'gpu' ? 'nv' : cat === 'cpu' ? 'amd' : 'fps'}">`;
      if (cat !== 'fps') {
        h += `<div class="lbl" data-role="${cat}.brand">–</div>`;
        h += `<div class="head"><span class="name" data-role="${cat}.name">–</span>`;
        h += has(cat,'load') ? `<span class="big">${val(cat+'.load','%')}</span></div>` : `<span class="big"></span></div>`;
        for (const f of rowsFor(cat)) h += `<div class="row" data-row="${cat}.${f}"><span class="k">${LABEL[f]}</span><span>${val(cat+'.'+f, UNIT[f])}</span></div>`;
      } else {
        h += `<div class="head"><span class="name">FPS</span>`;
        h += has('fps','fps') ? `<span class="big"><span data-role="fps.fps">–</span></span></div>` : `<span></span></div>`;
        if (has('fps','graph')) h += `<canvas data-role="ftgraph" width="320" height="46"></canvas>`;
        if (has('fps','frametime')) h += `<div class="ftline" data-row="fps.frametime">frametime ${val('fps.frametime','ms')}</div>`;
      }
      h += '</div>';
    }
    return h + '</div>';
  }

  function buildMin() {
    let h = '<div class="osd t-min">';
    for (const cat of orderList()) {
      if (cat === 'net') { h += netSeg('line'); continue; }
      if (cat === 'fps') {
        if (catList('fps').length && has('fps','fps'))
          h += `<div class="line"><span class="k fp">FPS</span><span class="v big" data-role="fps.fps">–</span>${has('fps','frametime')?`<span class="sub">${val('fps.frametime','ms')}</span>`:''}</div>`;
        continue;
      }
      const rs = rowsFor(cat); if (!catList(cat).length) continue;
      h += `<div class="line"><span class="k ${cat==='gpu'?'nv':'amd'}">${cat.toUpperCase()}</span>`;
      const parts = [];
      if (has(cat,'temp')) parts.push(`<span class="v">${val(cat+'.temp','°')}</span>`);
      const rest = rs.filter(f => f !== 'temp');
      for (const f of rest) parts.push(`<span class="sub">${val(cat+'.'+f, UNIT[f]==='MHz'?'':'' )}<i>${UNIT[f]}</i></span>`);
      if (has(cat,'load')) parts.push(`<span class="sub">${val(cat+'.load','%')}</span>`);
      h += parts.join('<span class="sub" style="opacity:.4">·</span>') + '</div>';
    }
    return h + '</div>';
  }

  function buildBar() {
    let h = '<div class="osd t-bar">';
    for (const cat of orderList()) {
      if (cat === 'net') { h += netSeg('grp'); continue; }
      if (cat === 'fps') {
        if (!catList('fps').length) continue;
        h += `<div class="grp fps"><div class="head"><span class="name">FPS${has('fps','frametime')?` · <span data-role="fps.frametime">–</span> ms`:''}</span>`;
        h += has('fps','fps') ? `<span class="big"><span data-role="fps.fps">–</span></span></div>` : `<span></span></div>`;
        if (has('fps','graph')) h += `<canvas data-role="ftgraph" width="320" height="40"></canvas>`;
        h += `</div>`;
        continue;
      }
      if (!catList(cat).length) continue;
      h += `<div class="grp ${cat==='gpu'?'nv':'amd'}">`;
      h += `<div class="head"><span class="name" data-role="${cat}.name">–</span>`;
      h += has(cat,'load') ? `<span class="big">${val(cat+'.load','%')}</span></div>` : `<span></span></div>`;
      if (has(cat,'load')) h += `<div class="track"><div class="fill" data-role="${cat}.loadbar" style="width:0%"></div></div>`;
      h += `<div class="stats">`;
      for (const f of rowsFor(cat)) h += `<span class="row" data-row="${cat}.${f}">${LABEL[f]} ${val(cat+'.'+f, UNIT[f])}</span>`;
      h += `</div></div>`;
    }
    return h + '</div>';
  }

  function buildNeon() {
    let h = '<div class="osd t-neon">';
    for (const cat of orderList()) {
      if (cat === 'net') { h += netSeg('grp'); continue; }
      if (!catList(cat).length) continue;
      const cls = cat==='gpu'?'nv':cat==='cpu'?'amd':'fps';
      h += `<div class="grp ${cls}"><div class="head">`;
      h += cat!=='fps' ? `<span class="name" data-role="${cat}.name">–</span>` : `<span class="name">FPS</span>`;
      if (cat!=='fps') h += has(cat,'load') ? `<span class="big">${val(cat+'.load','%')}</span></div>` : `<span></span></div>`;
      else h += has('fps','fps') ? `<span class="big"><span data-role="fps.fps">–</span></span></div>` : `<span></span></div>`;
      if (cat!=='fps') { h += `<div class="stats">`; for (const f of rowsFor(cat)) h += `<span class="row" data-row="${cat}.${f}">${val(cat+'.'+f, UNIT[f])}</span>`; h += `</div>`; }
      else if (has('fps','frametime')) h += `<div class="stats"><span class="row" data-row="fps.frametime">frametime ${val('fps.frametime','ms')}</span></div>`;
      h += `</div>`;
    }
    return h + '</div>';
  }

  function buildStrip() {
    let h = '<div class="osd t-strip">';
    for (const cat of orderList()) {
      if (cat === 'net') { h += netSeg('seg'); continue; }
      if (cat === 'fps') {
        if (!catList('fps').length) continue;
        h += `<div class="seg fps"><span class="nm">FPS</span>`;
        if (has('fps','fps')) h += `<span class="m"><span data-role="fps.fps">–</span></span>`;
        if (has('fps','frametime')) h += `<span class="m" style="font-size:13px" data-row="fps.frametime">${val('fps.frametime','ms')}</span>`;
        h += `</div>`;
        continue;
      }
      if (!catList(cat).length) continue;
      h += `<div class="seg ${cat==='gpu'?'nv':'amd'}"><span class="nm" data-role="${cat}.name">–</span>`;
      if (has(cat,'load')) h += `<span class="m">${val(cat+'.load','%')}</span>`;
      for (const f of rowsFor(cat)) h += `<span class="m" data-row="${cat}.${f}">${val(cat+'.'+f, UNIT[f])}</span>`;
      h += `</div>`;
    }
    return h + '</div>';
  }

  function buildTiles() {
    let h = '<div class="osd t-tiles">';
    for (const cat of orderList()) {
      if (cat === 'net') { h += netSeg('tile'); continue; }
      if (cat === 'fps') {
        if (!catList('fps').length) continue;
        h += `<div class="tile fps"><div class="cap">FPS</div>`;
        h += has('fps','fps') ? `<div class="num"><span data-role="fps.fps">–</span></div>` : `<div class="num">–</div>`;
        if (has('fps','frametime')) h += `<div class="sub" data-row="fps.frametime"><span data-role="fps.frametime">–</span> ms</div>`;
        h += `</div>`;
        continue;
      }
      if (!catList(cat).length) continue;
      h += `<div class="tile ${cat==='gpu'?'nv':'amd'}"><div class="cap" data-role="${cat}.name">–</div>`;
      h += has(cat,'load') ? `<div class="num">${val(cat+'.load','%')}</div>` : `<div class="num">–</div>`;
      const subs = rowsFor(cat).map(f => `<span data-row="${cat}.${f}">${val(cat+'.'+f, UNIT[f]==='°C'?'°':UNIT[f]==='MHz'?'':'')}<i>${UNIT[f]==='°C'?'':UNIT[f]}</i></span>`);
      if (subs.length) h += `<div class="sub">${subs.join(' · ')}</div>`;
      h += `</div>`;
    }
    return h + '</div>';
  }

  const BUILD = { compact: buildCompact, min: buildMin, bar: buildBar, neon: buildNeon, strip: buildStrip, tiles: buildTiles };

  // ===================== Panel bauen + Frametime-Graph ==================
  let ftCanvas = null, ftCtx = null;
  const FT_MAX = 300; let ftBuf = new Array(FT_MAX).fill(0);
  function drawFtGraph() {
    if (!ftCtx) return;
    const w = ftCanvas.width, h = ftCanvas.height;
    ftCtx.clearRect(0,0,w,h);
    const peak = Math.max(20, ...ftBuf);
    ftCtx.strokeStyle = '#6fe86f'; ftCtx.lineWidth = 1.5; ftCtx.beginPath();
    for (let i = 0; i < FT_MAX; i++) { const x = (i/(FT_MAX-1))*w, y = h-(ftBuf[i]/peak)*(h-2)-1; i?ftCtx.lineTo(x,y):ftCtx.moveTo(x,y); }
    ftCtx.stroke();
  }
  function pushFrametime(ms) { ftBuf.push(ms); if (ftBuf.length > FT_MAX) ftBuf.shift(); drawFtGraph(); }

  function renderPanel() {
    document.body.classList.remove('theme-compact','theme-min','theme-bar','theme-neon','theme-strip','theme-tiles');
    document.body.classList.add('theme-' + cfg.theme);
    panel.innerHTML = (BUILD[cfg.theme] || buildCompact)();
    ftCanvas = panel.querySelector('canvas[data-role="ftgraph"]');
    ftCtx = ftCanvas ? ftCanvas.getContext('2d') : null;
    drawFtGraph();
    lastFpsTextAt = 0;   // FPS-Zahl sofort setzen (nicht auf die Drosselung warten)
    paintValues();       // aktuelle Werte gleich einsetzen
    scheduleBounds();    // neue Panel-Groesse an die Shell (Fenster nachziehen)
  }

  // ===================== Werte einsetzen ================================
  // Feste Nachkommastellen je Feld -> die Textbreite springt nicht, wenn z. B.
  // Watt von 10.1 auf 10 faellt (waere sonst "10" statt "10.0" -> Position ruckt).
  // Zusammen mit tabular-nums (CSS) bleiben auch verschiedene Ziffern gleich breit.
  const VAL_DEC = { load: 0, temp: 0, power: 1, clock: 0, vram: 0, ram: 0, frametime: 1, fps: 0 };
  function fmtVal(field, v) {
    if (v == null) return null;
    const d = VAL_DEC[field];
    if (d == null) return v;
    const n = Number(v);
    return Number.isFinite(n) ? n.toFixed(d) : v;   // Nicht-Zahlen (z. B. "…") unveraendert
  }
  function setRole(role, v) { panel.querySelectorAll(`[data-role="${role}"]`).forEach(el => { el.textContent = (v == null ? '–' : v); }); }
  function setRow(rowKey, show) { panel.querySelectorAll(`[data-row="${rowKey}"]`).forEach(el => el.classList.toggle('hidden', !show)); }

  let lastFpsTextAt = 0;
  function nowMs() { return (window.performance && performance.now) ? performance.now() : Date.now(); }

  function paintValues() {
    // GPU / CPU
    for (const cat of ['gpu','cpu']) {
      const d = data[cat];
      setRole(cat+'.name', d ? d.name : '–');
      setRole(cat+'.brand', d ? d.brand : '');
      for (const f of ['load','temp','power','clock','vram','ram']) {
        const v = d ? d[f] : null;
        setRole(cat+'.'+f, fmtVal(f, v));
        setRow(cat+'.'+f, v != null);            // Zeile aus, wenn Sensor nichts liefert
        if (f === 'load') { const bar = panel.querySelector(`[data-role="${cat}.loadbar"]`); if (bar && v != null) bar.style.width = Math.max(0, Math.min(100, v)) + '%'; }
      }
    }
    // Netz: vorformatierte Texte aus der Shell; ohne laufende Zaehlung Gruppe weg
    {
      const n = data.net;
      panel.querySelectorAll('.grp-net').forEach(el => el.classList.toggle('hidden', !n));
      if (n) { setRole('net.rate', n.rate); setRole('net.total', n.total); }
    }
    if (data.api != null) setRole('gpu.api', data.api);
    // FPS-Zahlen gedrosselt (Graph läuft flüssig separat)
    if (nowMs() - lastFpsTextAt >= 240) {
      lastFpsTextAt = nowMs();
      if (data.fps != null) setRole('fps.fps', fmtVal('fps', data.fps));
      if (data.frametime != null) setRole('fps.frametime', fmtVal('frametime', data.frametime));
      setRow('fps.frametime', data.frametime != null);
    }
  }

  function updateOsd(d) {
    if (!d) return;
    if ('gpu' in d) data.gpu = d.gpu;
    if ('cpu' in d) data.cpu = d.cpu;
    if ('net' in d) data.net = d.net;
    if (d.api != null) data.api = d.api;
    if (d.fps != null) data.fps = d.fps;
    if (d.frametime != null) { data.frametime = d.frametime; pushFrametime(Number(d.frametime)); }
    paintValues();
  }

  // ===================== Config anwenden ================================
  function applyConfig(c) {
    if (!c) return;
    let rebuild = false;
    if (c.theme && c.theme !== cfg.theme) { cfg.theme = c.theme; rebuild = true; }
    if (c.fields) { cfg.fields = c.fields; rebuild = true; }
    if (c.order) { cfg.order = c.order; rebuild = true; }
    if (c.accent) { cfg.accent = c.accent; document.documentElement.style.setProperty('--accent', c.accent); }
    if (c.corner) { document.body.classList.remove('pos-tl','pos-tr','pos-bl','pos-br'); document.body.classList.add('pos-' + c.corner); }
    if (c.opacity != null) { cfg.opacity = c.opacity; document.documentElement.style.setProperty('--panel-op', c.opacity); }
    if (rebuild) renderPanel();
    else scheduleBounds();               // Ecke/Deckkraft ohne Rebuild -> Fenster trotzdem nachziehen
    if (editing) renderEditbar(false);   // Live-Edit-Leiste mitziehen (ohne den Slider zu ueberschreiben)
  }

  // ===================== Live-Edit + IPC ===============================
  let editing = false, drag = null;
  function setEdit(on) { editing = on; document.body.classList.toggle('edit', on);
    if (on) renderEditbar(true);
    if (!on) { panel.style.left = panel.style.top = panel.style.right = panel.style.bottom = ''; scheduleBounds(); } }

  // --- Live-Edit-Leiste: Design durchschalten, Deckkraft, Werte an/aus ---------
  function renderEditbar(full) {
    const tn = (EB_THEMES.find(t => t[0] === cfg.theme) || EB_THEMES[0])[1];
    document.getElementById('ebThemeName').textContent = tn;
    if (full) document.getElementById('ebOpacity').value = cfg.opacity != null ? cfg.opacity : 0.55;
    // Positions-Knoepfe je Theme: horizontale Themes (Leiste/Kacheln) sitzen mittig
    // oben/unten -> nur oben/unten anbieten; vertikale Themes -> vier Ecken.
    const horiz = (cfg.theme === 'strip' || cfg.theme === 'tiles');
    const cur = ['tl','tr','bl','br'].find(c => document.body.classList.contains('pos-' + c)) || 'tl';
    const posSet = horiz
      ? [['tl','▀','Oben'],['bl','▄','Unten']]
      : [['tl','◤','Oben links'],['tr','◥','Oben rechts'],['bl','◣','Unten links'],['br','◢','Unten rechts']];
    const curActive = horiz ? (cur[0] === 't' ? 'tl' : 'bl') : cur;
    const ebc = document.getElementById('ebCorners');
    ebc.classList.toggle('horiz', horiz);
    ebc.innerHTML = posSet.map(([c, sym, ti]) => `<button class="eb-corner${c === curActive ? ' on' : ''}" data-corner="${c}" title="${ti}">${sym}</button>`).join('');
    document.getElementById('ebFields').innerHTML = Object.keys(EB_FLD).map(cat =>
      `<div class="eb-frow"><span class="eb-grp">${cat.toUpperCase()}</span>` +
      EB_FLD[cat].map(([f, lbl]) => `<button class="eb-chip${(cfg.fields[cat] || []).includes(f) ? ' on' : ''}" data-cat="${cat}" data-f="${f}">${lbl}</button>`).join('') +
      `</div>`).join('');
  }
  function ebStepTheme(dir) {
    const i = EB_THEMES.findIndex(t => t[0] === cfg.theme);
    const ni = ((i < 0 ? 0 : i) + dir + EB_THEMES.length) % EB_THEMES.length;
    if (ipcRenderer) ipcRenderer.invoke('osd-edit-theme', EB_THEMES[ni][0]);
  }
  document.getElementById('ebPrev').addEventListener('click', () => ebStepTheme(-1));
  document.getElementById('ebNext').addEventListener('click', () => ebStepTheme(1));
  document.getElementById('ebOpacity').addEventListener('input', (e) => {
    const v = parseFloat(e.target.value);
    document.documentElement.style.setProperty('--panel-op', v);   // sofort sichtbar
    if (ipcRenderer) ipcRenderer.invoke('osd-edit-opacity', v);
  });
  document.getElementById('ebFields').addEventListener('click', (e) => {
    const chip = e.target.closest('.eb-chip'); if (!chip) return;
    const cat = chip.dataset.cat, f = chip.dataset.f;
    const arr = (cfg.fields[cat] || []).slice();
    const idx = arr.indexOf(f);
    if (idx >= 0) arr.splice(idx, 1);
    else { arr.push(f); const ord = EB_FLD[cat].map(d => d[0]); arr.sort((a, b) => ord.indexOf(a) - ord.indexOf(b)); }
    const nf = Object.assign({}, cfg.fields, { [cat]: arr });
    if (ipcRenderer) ipcRenderer.invoke('osd-edit-fields', nf);
  });
  document.getElementById('ebCorners').addEventListener('click', (e) => {
    const btn = e.target.closest('.eb-corner'); if (!btn) return;
    const corner = btn.dataset.corner;
    document.body.classList.remove('pos-tl','pos-tr','pos-bl','pos-br');
    document.body.classList.add('pos-' + corner);
    renderEditbar(false);   // aktiver Button + Leisten-Seite (via CSS) nachziehen
    if (ipcRenderer) ipcRenderer.invoke('osd-edit-corner', corner);
  });
  panel.addEventListener('pointerdown', (e) => {
    if (!editing || e.target.closest('#editDone')) return;
    const r = panel.getBoundingClientRect();
    drag = { dx: e.clientX - r.left, dy: e.clientY - r.top };
    document.body.classList.remove('pos-tl','pos-tr','pos-bl','pos-br');
    panel.style.right = panel.style.bottom = ''; panel.style.margin = '0'; panel.style.transform = 'none';
    panel.style.left = r.left + 'px'; panel.style.top = r.top + 'px';
    try { panel.setPointerCapture(e.pointerId); } catch (er) {}
    e.preventDefault();
  });
  panel.addEventListener('pointermove', (e) => { if (!drag) return; panel.style.left = (e.clientX - drag.dx) + 'px'; panel.style.top = (e.clientY - drag.dy) + 'px'; });
  panel.addEventListener('pointerup', () => {
    if (!drag) return; drag = null;
    const r = panel.getBoundingClientRect();
    const cx = r.left + r.width/2, cy = r.top + r.height/2;
    const corner = (cy < window.innerHeight/2 ? 't' : 'b') + (cx < window.innerWidth/2 ? 'l' : 'r');
    panel.style.left = panel.style.top = panel.style.margin = panel.style.transform = '';
    document.body.classList.add('pos-' + corner);
    renderEditbar(false);   // Ecken-Button + Leisten-Seite an die neue Position anpassen
    if (ipcRenderer) ipcRenderer.invoke('osd-edit-corner', corner);
  });
  window.addEventListener('wheel', (e) => { if (!editing || e.target.closest('#editbar')) return; e.preventDefault(); if (ipcRenderer) ipcRenderer.invoke('osd-edit-scale', e.deltaY < 0 ? 1 : -1); }, { passive: false });
  document.getElementById('editDone').addEventListener('click', () => { if (ipcRenderer) ipcRenderer.invoke('osd-edit-done'); });

  // Edit-Fenster (?editbg=1): eingefrorener Desktop-Schnappschuss als Hintergrund - sieht aus
  // wie Transparenz, ist aber ein normales interaktives Fenster (echtes Per-Pixel gibt es nur
  // im Composition-ANZEIGE-Overlay; dort ist der Body wie bisher transparent).
  try {
    if (new URLSearchParams(location.search).get('editbg')) {
      // Sofort sichtbar machen, synchron per URL statt ueber das asynchrone 'osd-edit'/
      // body.edit - sonst waere das Edit-Fenster fuer die Dauer dieses Web-Message-Umlaufs
      // kurz unsichtbar (der neue Fade-Start unten setzt opacity:0 nur fuer das Anzeige-
      // Overlay, aber sicherheitshalber schon hier explizit auf sichtbar).
      document.body.style.opacity = '1';
      // WICHTIG: html/body auf volle Hoehe - sonst ist die Hintergrund-Bezugsbox nur so hoch
      // wie der INHALT (Panel) und der Schnappschuss wird in den oberen Streifen gequetscht
      // (User-Befund "Bildschirm nach oben gequetscht"; darunter blieb es schwarz).
      document.documentElement.style.height = '100%';
      document.body.style.height = '100%';
      // Schnappschuss + dezente Abdunkelung: wirkt wie "Desktop leicht gedimmt" (Edit-Fokus).
      document.body.style.background = 'linear-gradient(rgba(8,10,14,.4), rgba(8,10,14,.4)), #000 url(https://data.lumora/osd-edit-bg.bmp?v=' + Date.now() + ') 0 0 / 100% 100% no-repeat';
    }
  } catch (e) {}

  let ipcRenderer = null;
  try { ipcRenderer = require('electron').ipcRenderer; } catch (e) {}
  if (ipcRenderer) {
    ipcRenderer.on('osd-data', (e, d) => updateOsd(d));
    ipcRenderer.on('osd-config', (e, c) => applyConfig(c));
    ipcRenderer.on('osd-edit', (e, on) => setEdit(on));
    // Sanftes Ein-/Ausblenden (osdFadeVisual in main.cpp) per CSS-Opacity statt der an
    // E_NOINTERFACE gescheiterten DComp-Visual3-Opacity. Edit-Fenster (?editbg=1, oben bereits
    // auf opacity:1 gesetzt) bleibt aussen vor - nur das Anzeige-Overlay startet unsichtbar,
    // und zwar genau HIER (im selben Tick, in dem der Listener registriert wird): so kann das
    // erste 'osd-fade'(true) nie auf einen noch fehlenden Listener treffen.
    const isEditBg = !!new URLSearchParams(location.search).get('editbg')
    if (!isEditBg) document.body.style.opacity = '0'
    ipcRenderer.on('osd-fade', (e, on) => {
      if (document.body.classList.contains('edit')) return
      document.body.style.transition = 'opacity ' + (on ? '.26s' : '.11s') + ' linear'
      document.body.style.opacity = on ? '1' : '0'
    })
    renderPanel();
  } else {
    // -------- Demo-Modus (im Browser ohne Electron): Beispielwerte + Theme-Umschalter
    document.body.style.opacity = '1'   // kein Shell-Fade hier -> Default (unsichtbar) sofort aufheben
    data = { gpu:{brand:'NVIDIA',name:'RTX 5080',load:45,temp:62,power:210,clock:2730,vram:8420},
             cpu:{brand:'AMD',name:'7950X3D',load:38,temp:68,power:95,clock:5000,ram:24560},
             fps:144, frametime:6.9, api:'D3D12' };
    renderPanel();
    let n = 0; setInterval(() => { data.fps = 138 + Math.round(Math.random()*12); data.frametime = +(1000/data.fps).toFixed(1); data.gpu.load = 40+Math.round(Math.random()*20); pushFrametime(data.frametime); paintValues(); }, 300);
    const themes = ['compact','min','bar','neon','strip','tiles'];
    const sw = document.createElement('div');
    sw.style.cssText = 'position:fixed;top:8px;left:8px;display:flex;gap:6px;font-family:sans-serif;font-weight:400;z-index:99';
    themes.forEach(t => { const b = document.createElement('button'); b.textContent = t; b.style.cssText='padding:5px 10px;border-radius:6px;border:1px solid #444;background:#1a1d24;color:#ddd;cursor:pointer;font-size:12px'; b.onclick = () => applyConfig({ theme: t }); sw.appendChild(b); });
    document.body.appendChild(sw);
    document.body.style.background = 'linear-gradient(158deg,#1d2b24,#0f171d 62%,#101a22)';
  }
</script>
