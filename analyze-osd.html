<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Analyse-OSD ("Ruckler-Blackbox") - BEWUSST eine eigene Designsprache, klar
     abgesetzt vom Gaming-OSD: Messinstrument-Optik (dunkle Glaskarte, Messrahmen,
     Monospace-Kennzahlen, pulsierender REC-Punkt, grosser Frametime-Schrieb).
     Wird per DirectComposition per-pixel-transparent ueber das Spiel gelegt und ist
     komplett click-through - hier NICHTS interaktiv machen. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none;
    font-family: 'Consolas', 'DejaVu Sans Mono', monospace;
    font-variant-numeric: tabular-nums; font-feature-settings: "tnum";
  }
  #panel {
    position: absolute; top: 0; left: 0; margin: 16px; width: 420px;
    background: linear-gradient(160deg, rgba(10,13,20,.90), rgba(8,10,16,.84));
    border: 1px solid rgba(120,190,255,.22);
    border-radius: 14px; padding: 12px 14px 10px;
    box-shadow: 0 10px 34px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.05);
    backdrop-filter: blur(3px);
    color: #dce6f2;
  }
  /* Kopfzeile: REC-Punkt + Titel + Laufzeit */
  .head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .rec { width: 9px; height: 9px; border-radius: 50%; background: #ff4d4d;
         box-shadow: 0 0 0 0 rgba(255,77,77,.7); animation: pulse 1.6s infinite; flex: 0 0 auto; }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(255,77,77,.65); }
    70%  { box-shadow: 0 0 0 7px rgba(255,77,77,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,77,77,0); }
  }
  .title { font-size: 11px; letter-spacing: .18em; color: #8fb4dd; text-transform: uppercase; }
  .time { margin-left: auto; font-size: 13px; color: #eaf2ff; font-weight: 700; }
  /* Kennzahlen-Reihe */
  .stats { display: flex; gap: 8px; margin-bottom: 9px; }
  .stat { flex: 1; background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.06);
          border-radius: 9px; padding: 6px 8px 5px; }
  .stat .k { font-size: 9px; letter-spacing: .14em; color: #7e93ab; text-transform: uppercase; }
  .stat .v { font-size: 17px; font-weight: 700; color: #eaf2ff; line-height: 1.15; }
  .stat .v small { font-size: 10px; color: #7e93ab; font-weight: 400; margin-left: 2px; }
  .stat.alarm .v { color: #ff7a7a; }
  /* Frametime-Schrieb */
  #graphWrap { position: relative; height: 74px; border-radius: 9px; overflow: hidden;
               background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.06); }
  #ft { display: block; width: 100%; height: 100%; }
  .axis { position: absolute; right: 6px; top: 4px; font-size: 9px; color: #6f8399; }
  /* Befund-Banner */
  #find { margin-top: 9px; border-radius: 9px; padding: 8px 10px; font-size: 12px;
          background: linear-gradient(90deg, rgba(255,86,86,.16), rgba(255,86,86,.05));
          border: 1px solid rgba(255,120,120,.30); color: #ffd9d9;
          display: none; animation: slidein .28s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes slidein { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  #find b { color: #fff; }
  #find .sub { display: block; color: #ffb9b9; font-size: 10.5px; margin-top: 2px; }
  .foot { margin-top: 8px; display: flex; align-items: center; gap: 6px; font-size: 9.5px; color: #64788d; }
  .dot { width: 4px; height: 4px; border-radius: 50%; background: #3f9d5a; }
  .dot.warn { background: #d8a13a; }
</style>
</head>
<body>
<div id="panel">
  <div class="head">
    <div class="rec"></div>
    <div class="title">Ruckler-Analyse</div>
    <div class="time" id="time">00:00</div>
  </div>
  <div class="stats">
    <div class="stat"><div class="k">FPS Ø</div><div class="v" id="fps">–</div></div>
    <div class="stat"><div class="k">Frametime</div><div class="v" id="ft">–<small>ms</small></div></div>
    <div class="stat" id="spikeBox"><div class="k">Ruckler</div><div class="v" id="spikes">0</div></div>
  </div>
  <div id="graphWrap"><canvas id="ftc"></canvas><div class="axis" id="axis">50 ms</div></div>
  <div id="find"></div>
  <div class="foot"><span class="dot" id="hdot"></span><span id="hint">Messung laeuft – Alt+A beendet sie</span></div>
</div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  let ipcRenderer = null;
  try { ipcRenderer = require('electron').ipcRenderer; } catch (e) {}

  // ---- Panelgroesse an die Shell melden (Fenster wird darauf verkleinert -> das
  //      Overlay kann NIEMALS Klicks ausserhalb des Panels blockieren) -------------
  const panel = $('panel');
  let _rb = 0;
  function reportBounds() {
    if (!ipcRenderer) return;
    const r = panel.getBoundingClientRect();
    if (r.width < 2 || r.height < 2) return;
    const dpr = window.devicePixelRatio || 1, M = 16;
    ipcRenderer.invoke('an-bounds', { w: Math.ceil((r.width + 2 * M) * dpr), h: Math.ceil((r.height + 2 * M) * dpr) });
  }
  function scheduleBounds() { if (_rb) return; _rb = requestAnimationFrame(() => { _rb = 0; reportBounds(); }); }
  try { new ResizeObserver(scheduleBounds).observe(panel); } catch (e) {}

  // ---- Frametime-Schrieb (eigener, groesser als im Gaming-OSD) ------------------
  const cv = $('ftc'), ctx = cv.getContext('2d');
  const N = 240, hist = new Array(N).fill(0);
  let spikeMarks = new Array(N).fill(0);
  function draw() {
    const dpr = window.devicePixelRatio || 1;
    const w = cv.clientWidth, h = cv.clientHeight;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
      cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    // Skala dynamisch: mind. 50 ms, sonst 1,25x Maximum (gerundet)
    let mx = 0; for (const v of hist) if (v > mx) mx = v;
    const scale = Math.max(50, Math.ceil(mx * 1.25 / 10) * 10);
    $('axis').textContent = scale + ' ms';
    // Gitter (16,7 / 33,3 ms = 60/30 fps)
    ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 1;
    for (const ms of [16.7, 33.3]) {
      const y = h - (ms / scale) * h;
      if (y > 2 && y < h - 2) { ctx.beginPath(); ctx.moveTo(0, y + .5); ctx.lineTo(w, y + .5); ctx.stroke(); }
    }
    // Verlaufs-Flaeche
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, 'rgba(96,190,255,.42)'); g.addColorStop(1, 'rgba(96,190,255,.03)');
    ctx.beginPath(); ctx.moveTo(0, h);
    for (let i = 0; i < N; i++) {
      const x = (i / (N - 1)) * w, y = h - Math.min(1, hist[i] / scale) * h;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(w, h); ctx.closePath(); ctx.fillStyle = g; ctx.fill();
    // Linie
    ctx.beginPath();
    for (let i = 0; i < N; i++) {
      const x = (i / (N - 1)) * w, y = h - Math.min(1, hist[i] / scale) * h;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.strokeStyle = 'rgba(140,210,255,.95)'; ctx.lineWidth = 1.4; ctx.stroke();
    // Spike-Marker
    for (let i = 0; i < N; i++) if (spikeMarks[i]) {
      const x = (i / (N - 1)) * w;
      ctx.strokeStyle = 'rgba(255,90,90,.75)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, h); ctx.stroke();
    }
  }
  function pushFt(ms, spike) {
    hist.push(ms); hist.shift();
    spikeMarks.push(spike ? 1 : 0); spikeMarks.shift();
    draw();
  }

  // ---- Daten von der Shell ------------------------------------------------------
  function fmtTime(s) {
    s = Math.max(0, s | 0);
    const m = (s / 60) | 0, r = s % 60;
    return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r;
  }
  let lastSpikes = 0;
  if (ipcRenderer) {
    ipcRenderer.on('an-data', (e, d) => {
      if (!d) return;
      $('time').textContent = fmtTime(d.sec);
      $('fps').textContent = d.avgFps > 0 ? d.avgFps.toFixed(0) : '–';
      $('ft').innerHTML = d.medianFt > 0 ? d.medianFt.toFixed(1) + '<small>ms</small>' : '–<small>ms</small>';
      $('spikes').textContent = d.spikes | 0;
      $('spikeBox').classList.toggle('alarm', (d.spikes | 0) > 0);
      pushFt(d.medianFt > 0 ? d.medianFt : 0, (d.spikes | 0) > lastSpikes);
      lastSpikes = d.spikes | 0;
      // Fusszeile: Selbstlast + Hinweise ehrlich anzeigen
      const perm = d.selfPermille | 0;
      $('hdot').className = 'dot' + (perm > 10 || d.err ? ' warn' : '');
      let hint = 'Messung laeuft – Alt+A beendet sie';
      if (d.err === 200) hint = 'Entlastet: Prozess-Detailmessung aus (Selbstlast)';
      else if (d.err) hint = 'Eingeschraenkt: Kernel-Messung nicht verfuegbar';
      else if (d.target) hint = d.target + ' – Alt+A beendet die Messung';
      $('hint').textContent = hint;
      scheduleBounds();
    });
    ipcRenderer.on('an-finding', (e, f) => {
      if (!f || !f.suspects || !f.suspects.length) return;
      const s = f.suspects[0];
      const kindTxt = { driver: 'Treiber', process: 'Programm', 'gpu-throttle': 'GPU', vram: 'Grafikspeicher',
                        disk: 'Datentraeger', 'proc-start': 'Programmstart', 'game-internal': 'Spiel selbst' }[s.kind] || s.kind;
      const el = $('find');
      el.innerHTML = '<b>Ruckler #' + f.id + ' · ' + (f.ftMs | 0) + ' ms</b> – ' + kindTxt +
                     (s.name ? ': ' + s.name : '') + '<span class="sub">' + (s.evidence || '') + '</span>';
      el.style.display = 'block';
      el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
      clearTimeout(el._t); el._t = setTimeout(() => { el.style.display = 'none'; scheduleBounds(); }, 5000);
      scheduleBounds();
    });
  }
  draw(); scheduleBounds();
  window.addEventListener('resize', () => { draw(); scheduleBounds(); });
})();
</script>
</body>
</html>
